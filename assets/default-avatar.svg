<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="helmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#240046" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e29"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="#0d1117" rx="200" />
  
  <!-- Outer Accent Rings -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#helmGrad)" stroke-width="3" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#2a324b" stroke-width="1.5" />

  <!-- Helmet Outer Shell -->
  <path d="M 120 280 C 100 240, 95 180, 130 110 C 160 50, 240 50, 280 100 C 315 140, 310 230, 290 280 C 275 315, 220 330, 190 330 C 150 330, 130 305, 120 280 Z" 
        fill="url(#carbonGrad)" stroke="#2b3548" stroke-width="4"/>

  <!-- Helmet Aero Fin Top -->
  <path d="M 160 80 Q 200 65 240 80 L 235 95 Q 200 82 165 95 Z" fill="url(#helmGrad)" />

  <!-- Aerodynamic Side Ducts -->
  <path d="M 105 200 L 130 205 L 125 240 L 100 235 Z" fill="#1e2533" stroke="url(#helmGrad)" stroke-width="1.5"/>
  <path d="M 295 200 L 270 205 L 275 240 L 300 235 Z" fill="#1e2533" stroke="url(#helmGrad)" stroke-width="1.5"/>

  <!-- Visor Assembly -->
  <path d="M 130 160 C 145 145, 255 145, 270 160 C 285 175, 280 230, 260 245 C 230 260, 170 260, 140 245 C 120 230, 115 175, 130 160 Z" 
        fill="url(#visorGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>

  <!-- Visor Highlights & Glare Reflex -->
  <path d="M 145 170 Q 200 160 255 170 Q 200 180 145 170 Z" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="170" cy="190" rx="22" ry="12" fill="#ffffff" opacity="0.3" transform="rotate(-20 170 190)"/>

  <!-- Chin Vent & Carbon Guard -->
  <path d="M 170 275 L 230 275 L 225 305 L 175 305 Z" fill="#111622" stroke="#333f57" stroke-width="2"/>
  <line x1="180" y1="285" x2="220" y2="285" stroke="url(#helmGrad)" stroke-width="2"/>
  <line x1="183" y1="295" x2="217" y2="295" stroke="url(#helmGrad)" stroke-width="2"/>

  <!-- HANS Anchor Hardware / Bolts -->
  <circle cx="120" cy="265" r="7" fill="#44516d" stroke="#8892b0" stroke-width="2"/>
  <circle cx="280" cy="265" r="7" fill="#44516d" stroke="#8892b0" stroke-width="2"/>

  <!-- FIA Endurance 24H Badge -->
  <rect x="165" y="115" width="70" height="18" rx="4" fill="#0b0e14" stroke="url(#helmGrad)" stroke-width="1"/>
  <text x="200" y="128" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1.5">24H APEX</text>
</svg>
