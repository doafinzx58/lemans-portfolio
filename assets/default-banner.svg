<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0f1423"/>
      <stop offset="100%" stop-color="#160c2b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="carbonGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 L 40 20 L 20 40 Z" fill="#0b0e17" stroke="#161c28" stroke-width="0.8"/>
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Asphalt Night Background -->
  <rect width="1600" height="600" fill="url(#bgGrad)"/>
  <rect width="1600" height="600" fill="url(#carbonGrid)" opacity="0.35"/>

  <!-- High-Speed Aerodynamic Dynamic Streaks / Mulsanne Straight -->
  <g opacity="0.85">
    <path d="M -100 480 C 400 460, 900 380, 1700 220" fill="none" stroke="url(#accentGrad)" stroke-width="6" filter="url(#neonGlow)"/>
    <path d="M -50 510 C 450 490, 1000 400, 1700 250" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
    <path d="M -150 450 C 350 430, 850 340, 1700 180" fill="none" stroke="#9d4edd" stroke-width="3" opacity="0.7"/>
    <path d="M 100 560 C 600 520, 1100 420, 1700 290" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="20 10" opacity="0.4"/>
  </g>

  <!-- Speed Blur Ribbons -->
  <polygon points="0,550 650,450 680,480 0,600" fill="url(#streamGrad)" opacity="0.15"/>
  <polygon points="400,480 1200,320 1230,350 420,530" fill="url(#streamGrad)" opacity="0.2"/>

  <!-- Chequered Flag Motifs (Racing Edge) -->
  <g opacity="0.2" transform="translate(1300, 50) skewX(-20)">
    <rect x="0" y="0" width="30" height="30" fill="#ffffff"/>
    <rect x="30" y="30" width="30" height="30" fill="#ffffff"/>
    <rect x="60" y="0" width="30" height="30" fill="#ffffff"/>
    <rect x="90" y="30" width="30" height="30" fill="#ffffff"/>
    <rect x="120" y="0" width="30" height="30" fill="#ffffff"/>
    <rect x="150" y="30" width="30" height="30" fill="#ffffff"/>
    <rect x="0" y="60" width="30" height="30" fill="#ffffff"/>
    <rect x="30" y="90" width="30" height="30" fill="#ffffff"/>
    <rect x="60" y="60" width="30" height="30" fill="#ffffff"/>
    <rect x="90" y="90" width="30" height="30" fill="#ffffff"/>
    <rect x="120" y="60" width="30" height="30" fill="#ffffff"/>
    <rect x="150" y="90" width="30" height="30" fill="#ffffff"/>
  </g>

  <!-- Le Mans Endurance Circuit Graphic Backdrop (Stylized Circuit de la Sarthe) -->
  <g transform="translate(950, 100) scale(0.65)" opacity="0.28" stroke="#00f2fe" stroke-width="4" fill="none">
    <path d="M 120 40 L 450 30 C 520 28, 560 60, 580 110 L 650 320 C 670 380, 640 430, 580 440 L 480 450 C 440 455, 420 490, 420 540 C 420 590, 370 620, 310 610 L 220 590 C 180 580, 160 540, 170 500 L 190 420 C 195 380, 170 350, 130 350 L 70 350 C 30 350, 10 320, 20 270 L 40 180 C 50 120, 80 50, 120 40 Z"/>
    <circle cx="120" cy="40" r="12" fill="#00f2fe" stroke="#ffffff" stroke-width="3"/>
    <text x="145" y="45" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22">START / FINISH LINE</text>
    <text x="590" y="100" fill="#9d4edd" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20">TERTRE ROUGE</text>
    <text x="670" y="300" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20">MULSANNE STRAIGHT (340 KM/H)</text>
    <text x="440" y="620" fill="#9d4edd" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20">PORSCHE CURVES</text>
  </g>

  <!-- Pit Wall Telemetry HUD overlay marks -->
  <g font-family="'Courier New', monospace" font-size="12" fill="#00f2fe" opacity="0.75">
    <text x="60" y="60">FIA WEC / 24 HEURES DU MANS</text>
    <text x="60" y="80">SESSION: RACEDAY // LAP 218 // AIR 24°C // TRACK 31°C</text>
    <line x1="60" y1="95" x2="380" y2="95" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 4"/>
  </g>

  <!-- Giant Watermark Typography -->
  <text x="70" y="320" font-family="'Arial Black', Impact, sans-serif" font-size="110" font-weight="900" fill="#ffffff" opacity="0.04" letter-spacing="12">24H ENDURANCE</text>
  <text x="70" y="420" font-family="'Arial Black', Impact, sans-serif" font-size="70" font-weight="900" fill="url(#accentGrad)" opacity="0.12" letter-spacing="8">LE MANS APEX</text>

  <!-- Bottom Accent Strip -->
  <rect x="0" y="588" width="1600" height="12" fill="url(#accentGrad)"/>
  <rect x="0" y="584" width="300" height="4" fill="#00f2fe" filter="url(#neonGlow)"/>
</svg>
